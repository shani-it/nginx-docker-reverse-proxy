version: '3.8'

services:
  app1_container:
    build: ./app1
    container_name: app1_container
    restart: always
    networks:
      - proxy_net

  app2_container:
    build: ./app2
    container_name: app2_container
    restart: always
    networks:
      - proxy_net

  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1_container
      - app2_container
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
